name: Deploy to server

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/foodgram-backend

jobs:
  docker-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  server:
    needs: docker-hub
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git pull + docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main
            cd infra
            docker compose -f docker-compose.production.yml --env-file .env pull
            docker compose -f docker-compose.production.yml --env-file .env up -d

  notify:
    name: Telegram — успешный деплой
    needs: server
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Отправить сообщение в Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=✅ Foodgram: деплой успешен%0A📦 ${{ github.repository }}%0A🌿 ${{ github.ref_name }}%0A🔗 ${{ github.sha }}%0A👤 ${{ github.actor }}" \
            --data-urlencode "disable_web_page_preview=true"
