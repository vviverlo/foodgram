upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name foodikson.mooo.com;
    server_tokens off;
    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 20M;

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/js/ {
        alias /usr/share/nginx/html/static/js/;
    }
    location ^~ /static/css/ {
        alias /usr/share/nginx/html/static/css/;
    }
    location ^~ /static/media/ {
        alias /usr/share/nginx/html/static/media/;
    }

    location /static/ {
        alias /var/html/static/;
    }

    location /media/ {
        alias /var/html/media/;
    }

    location ^~ /s/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name foodikson.mooo.com;
    server_tokens off;
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/foodikson.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodikson.mooo.com/privkey.pem;

    location /api/docs/ {
        root /usr/share/nginx/html;
