# Ручной запуск: Actions → Deploy → Run workflow
# Или автоматически при push в main

name: Deploy to server

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/foodgram-backend

jobs:
  docker-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  server:
    needs: docker-hub
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git pull + docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main
            cd infra
            docker compose -f docker-compose.production.yml --env-file .env pull
            docker compose -f docker-compose.production.yml --env-file .env up -d
